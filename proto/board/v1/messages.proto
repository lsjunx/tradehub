syntax = "proto3";

package board.v1;

option go_package = "board-agent/internal/pb/board/v1;boardv1";

message Envelope {
  string msg_id = 1;
  oneof payload {
    Register register = 10;
    Heartbeat heartbeat = 11;
    Command command = 12;
    CommandResult command_result = 13;
    Event event = 14;
    Capability capability = 15;
  }
}

message Register {
  string device_id = 1;
  string ip = 2;
  int32 port = 3;
}

message Heartbeat {
  string device_id = 1;
  int64 ts_unix_ms = 2;
  string status = 3;
}

message Command {
  string device_id = 1;
  string cmd_id = 2;
  string action = 3;
  string args = 4;
  string risk_class = 5; // safe|sensitive|high; optional
  string flow_id = 6;    // required for ui.* when enforced later
}

message CommandResult {
  string device_id = 1;
  string cmd_id = 2;
  bool ok = 3;
  string message = 4;
}

message Event {
  string event_id = 1;
  string device_id = 2;
  string name = 3;
  string payload_json = 4;
  int64 ts_unix_ms = 5;
}

message CapabilityEntry {
  string action = 1;
  string risk_hint = 2; // safe|sensitive|high
}

message Capability {
  string device_id = 1;
  repeated CapabilityEntry entries = 2;
}
