syntax = "proto3";

package cloud.v1;

option go_package = "github.com/local/saas-service/internal/pb/cloud/v1;cloudv1";

// WSS JSON 信封：{"type":"...","payload":{...}}
// type：gateway_hello, device_register, device_heartbeat, device_offline, command, command_result

message GatewayHello {
  string gateway_id = 1;
}

message DeviceRegister {
  string device_id = 1;
  string ip = 2;
  int32 port = 3;
  string gateway_id = 4;
}

message DeviceHeartbeat {
  string device_id = 1;
  int64 ts_unix_ms = 2;
  string status = 3;
  string gateway_id = 4;
}

message DeviceOffline {
  string device_id = 1;
  string gateway_id = 2;
}

message Command {
  string device_id = 1;
  string cmd_id = 2;
  string action = 3;
  string args = 4;
}

message CommandResult {
  string device_id = 1;
  string cmd_id = 2;
  bool ok = 3;
  string message = 4;
}
