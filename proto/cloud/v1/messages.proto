syntax = "proto3";

package cloud.v1;

option go_package = "github.com/tradehub/saas-service/internal/pb/cloud/v1;cloudv1";

// MsgType 表示 WSS JSON 信封中的 type 字段语义。
// 线网字符串由生成代码的 MsgType_name 推导：去掉 MSG_TYPE_ 前缀再转小写
//（如 MSG_TYPE_GATEWAY_HELLO → gateway_hello）。见各服务 TypeName/ParseType。
// 信封格式：{"type":"<wire string>","payload":{...}}
enum MsgType {
  MSG_TYPE_UNSPECIFIED = 0;
  MSG_TYPE_GATEWAY_HELLO = 1;
  MSG_TYPE_DEVICE_REGISTER = 2;
  MSG_TYPE_DEVICE_HEARTBEAT = 3;
  MSG_TYPE_DEVICE_OFFLINE = 4;
  MSG_TYPE_COMMAND = 5;           // SaaS → Gateway
  MSG_TYPE_COMMAND_RESULT = 6;    // Gateway → SaaS
  MSG_TYPE_EVENT = 7;
  MSG_TYPE_CAPABILITY = 8;
}

message GatewayHello {
  string gateway_id = 1;
}

message DeviceRegister {
  string device_id = 1;
  string ip = 2;
  int32 port = 3;
  string gateway_id = 4;
}

message DeviceHeartbeat {
  string device_id = 1;
  int64 ts_unix_ms = 2;
  string status = 3;
  string gateway_id = 4;
}

message DeviceOffline {
  string device_id = 1;
  string gateway_id = 2;
}

message Command {
  string device_id = 1;
  string cmd_id = 2;
  string action = 3;
  string args = 4;
}

message CommandResult {
  string device_id = 1;
  string cmd_id = 2;
  bool ok = 3;
  string message = 4;
}

message DeviceEvent {
  string event_id = 1;
  string device_id = 2;
  string name = 3;
  string payload_json = 4;
  int64 ts_unix_ms = 5;
  string gateway_id = 6;
}

message DeviceCapability {
  string device_id = 1;
  string gateway_id = 2;
  repeated CapabilityEntry entries = 3;
}

message CapabilityEntry {
  string action = 1;
  string risk_hint = 2;
}
