<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Device Console</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    .online { color: green; }
    .offline { color: #999; }
    #result { white-space: pre-wrap; background: #f6f6f6; padding: 0.75rem; }
    #wsState { color: #666; font-size: 0.9rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
  <h1>Device Console</h1>
  <div id="wsState">WS: connecting…</div>
  <table>
    <thead>
      <tr><th>Device</th><th>IP</th><th>Port</th><th>Gateway</th><th>Status</th><th>Last Seen</th></tr>
    </thead>
    <tbody id="devices"></tbody>
  </table>
  <form id="cmdForm">
    <label>Device ID <input name="device_id" required /></label>
    <label>Args <input name="args" value="hello" /></label>
    <button type="submit">Echo</button>
  </form>
  <h2>Result</h2>
  <div id="result"></div>
  <script>
    const tbody = document.getElementById('devices');
    const result = document.getElementById('result');
    const wsState = document.getElementById('wsState');
    const deviceMap = new Map();
    const pendingCmds = new Set();
    let reconnectMs = 1000;

    function render() {
      tbody.innerHTML = '';
      [...deviceMap.values()].forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${d.device_id}</td><td>${d.ip||''}</td><td>${d.port||0}</td>
          <td>${d.gateway_id||''}</td>
          <td class="${d.online?'online':'offline'}">${d.online?'online':'offline'} ${d.status||''}</td>
          <td>${d.last_seen||''}</td>`;
        tr.onclick = () => { document.querySelector('[name=device_id]').value = d.device_id; };
        tbody.appendChild(tr);
      });
    }

    function upsertDevice(d) {
      if (!d || !d.device_id) return;
      deviceMap.set(d.device_id, d);
      render();
    }

    async function loadSnapshot() {
      const r = await fetch('/api/devices');
      const list = await r.json();
      deviceMap.clear();
      (list || []).forEach(d => deviceMap.set(d.device_id, d));
      render();
    }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(proto + '//' + location.host + '/ws/ui');
      ws.onopen = () => {
        wsState.textContent = 'WS: connected (push)';
        reconnectMs = 1000;
        loadSnapshot();
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'device_updated') upsertDevice(msg.payload);
        if (msg.type === 'command_result') {
          const p = msg.payload || {};
          if (p.cmd_id) pendingCmds.delete(p.cmd_id);
          result.textContent = JSON.stringify(p, null, 2);
        }
      };
      ws.onclose = () => {
        wsState.textContent = 'WS: disconnected, retrying…';
        setTimeout(connectWS, reconnectMs);
        reconnectMs = Math.min(reconnectMs * 2, 15000);
      };
      ws.onerror = () => { try { ws.close(); } catch (_) {} };
    }

    loadSnapshot();
    connectWS();

    document.getElementById('cmdForm').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const id = fd.get('device_id');
      const args = fd.get('args');
      const r = await fetch('/api/devices/' + encodeURIComponent(id) + '/commands', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'echo', args})
      });
      const body = await r.json();
      if (r.status === 202 && body.cmd_id) {
        pendingCmds.add(body.cmd_id);
        result.textContent = 'accepted, waiting WS result…\n' + JSON.stringify(body, null, 2);
        // 兜底：若 WS 丢了，轮询指令状态
        const cmdId = body.cmd_id;
        const timer = setInterval(async () => {
          if (!pendingCmds.has(cmdId)) { clearInterval(timer); return; }
          const cr = await fetch('/api/commands/' + encodeURIComponent(cmdId));
          if (!cr.ok) return;
          const rec = await cr.json();
          if (rec.status && rec.status !== 'accepted') {
            pendingCmds.delete(cmdId);
            clearInterval(timer);
            result.textContent = JSON.stringify(rec, null, 2);
          }
        }, 1000);
        setTimeout(() => clearInterval(timer), 15000);
        return;
      }
      result.textContent = r.status + '\n' + JSON.stringify(body, null, 2);
    };
  </script>
</body>
</html>
