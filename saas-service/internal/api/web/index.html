<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Device Console</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1.5rem; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.6rem; text-align: left; }
    .online { color: green; }
    .offline { color: #999; }
    #result { white-space: pre-wrap; background: #f6f6f6; padding: 0.75rem; }
  </style>
</head>
<body>
  <h1>Device Console</h1>
  <table>
    <thead>
      <tr><th>Device</th><th>IP</th><th>Port</th><th>Gateway</th><th>Status</th><th>Last Seen</th></tr>
    </thead>
    <tbody id="devices"></tbody>
  </table>
  <form id="cmdForm">
    <label>Device ID <input name="device_id" required /></label>
    <label>Args <input name="args" value="hello" /></label>
    <button type="submit">Echo</button>
  </form>
  <h2>Result</h2>
  <div id="result"></div>
  <script>
    const tbody = document.getElementById('devices');
    const result = document.getElementById('result');

    function render(list) {
      tbody.innerHTML = '';
      (list || []).forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${d.device_id}</td><td>${d.ip||''}</td><td>${d.port||0}</td>
          <td>${d.gateway_id||''}</td>
          <td class="${d.online?'online':'offline'}">${d.online?'online':'offline'} ${d.status||''}</td>
          <td>${d.last_seen||''}</td>`;
        tr.onclick = () => { document.querySelector('[name=device_id]').value = d.device_id; };
        tbody.appendChild(tr);
      });
    }

    async function refresh() {
      const r = await fetch('/api/devices');
      render(await r.json());
    }

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(proto + '//' + location.host + '/ws/ui');
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'device_updated') refresh();
      if (msg.type === 'command_result') result.textContent = JSON.stringify(msg.payload, null, 2);
    };
    refresh();
    setInterval(refresh, 5000);

    document.getElementById('cmdForm').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const id = fd.get('device_id');
      const args = fd.get('args');
      const r = await fetch('/api/devices/' + encodeURIComponent(id) + '/commands', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'echo', args})
      });
      const text = await r.text();
      result.textContent = r.status + '\n' + text;
      refresh();
    };
  </script>
</body>
</html>
